# Runs the daily picks job each morning and publishes the site to GitHub Pages.
#
# GitHub's clock is UTC and ignores daylight saving, so there are two morning runs:
# 10:00 UTC is 6 AM during daylight time, 11:00 UTC is 6 AM during standard time.
# The script itself skips anything before 6 AM Eastern or a day that's already done,
# so only one of them does the work. The 13:30 run is a backup in case GitHub drops one.

name: Daily picks

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Pick again even if today is already done'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pick today's items
        run: python scripts/daily.py ${{ inputs.force && '--force' || '' }}
      - name: Save picks
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Daily picks $(TZ=America/New_York date +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: always() && needs.update.result != 'failure' && (github.event_name != 'schedule' || needs.update.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
