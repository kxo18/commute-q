<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Commute Queue</title>
  <meta name="description" content="Daily listening and reading for the capstone and career tracks.">
  <meta name="theme-color" content="#F8F1E7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1411" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CommuteQ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div>
        <h1 class="brand">Commute Queue</h1>
        <p class="today-date" id="todayDate"></p>
      </div>
      <button class="icon-btn" id="openSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="seg track-seg" role="radiogroup" aria-label="Track">
      <button role="radio" data-track="capstone">Capstone</button>
      <button role="radio" data-track="career">Career</button>
      <button role="radio" data-track="both">Both</button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Today</span>
    </button>
    <button role="tab" data-tab="listen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg>
      <span>Listen</span>
    </button>
    <button role="tab" data-tab="read">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
      <span>Read</span>
    </button>
    <button role="tab" data-tab="watch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>
      <span>Watch</span>
    </button>
    <button role="tab" data-tab="saved">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span>Saved</span><b class="badge" id="savedBadge" hidden></b>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheet" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grip"></div>
      <h2 id="sheetTitle">Settings</h2>
      <p class="muted" id="updatedLine"></p>
      <p class="muted small" id="sourcesLine"></p>
      <div class="sheet-group">
        <h3>Your progress</h3>
        <p class="muted small">Progress is saved on this phone only. Back it up now and then so you don't lose your checkmarks.</p>
        <button class="btn btn-primary wide" id="backupBtn">Back up progress</button>
        <label class="btn wide" for="restoreInput">Restore from a backup</label>
        <input type="file" id="restoreInput" accept="application/json,.json" hidden>
      </div>
      <div class="sheet-group">
        <button class="btn btn-quiet wide danger" id="resetBtn">Clear all progress</button>
      </div>
      <button class="btn wide" id="closeSettings">Done</button>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
